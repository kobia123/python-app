replicaCount: 1
image:
  repository: kobia123/python-app
  pullPolicy: IfNotPresent
  tag: v2
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}
serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 5000
ingress:
  enabled: true
  className: "nginx"
  annotations:
    # מבטל את ההפניה האוטומטית ל-HTTPS כדי שיעבוד חלק ב-HTTP מקומי
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  hosts:
    - host: "localhost"
      paths:
        - path: /api/v1/info
          pathType: Prefix
        - path: /api/v1/Healthz
          pathType: Prefix  
  tls: []

httpRoute:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 50M
livenessProbe:
  httpGet:
    path: /api/v1/Healthz
    port: http
    
readinessProbe:
  httpGet:
    path: /api/v1/Healthz
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: {}